<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ruang Ujian</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #eef2f7;
    color: #172033;
}

.kartu {
    width: 94%;
    max-width: 600px;
    margin: 30px auto;
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.sub {
    text-align: center;
    color: #667085;
}

.tanggal {
    text-align: center;
    margin: 20px 0;
    padding: 14px;
    background: #eef4ff;
    border-radius: 12px;
    font-weight: bold;
}

.pilih-kelas {
    display: flex;
    gap: 8px;
    margin: 15px 0 25px;
}

.pilih-kelas button {
    flex: 1;
    margin: 0;
    padding: 12px 5px;
    font-size: 15px;
}

button {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    background: #1769e0;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.kelas-aktif {
    background: #0b7a3b !important;
}

.jadwal {
    border: 1px solid #e4e7ec;
    border-radius: 15px;
    padding: 18px;
    margin-top: 15px;
}

.mapel {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
}

.waktu {
    color: #667085;
    margin-bottom: 12px;
}

.status {
    display: inline-block;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 12px;
}

.belum {
    background: #fff3cd;
    color: #664d03;
}

.aktif {
    background: #e8f7ee;
    color: #147a3d;
}

.selesai {
    background: #fde8e8;
    color: #b42318;
}

.info {
    margin-top: 20px;
    padding: 15px;
    background: #f5f6f8;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
}

.kosong {
    text-align: center;
    padding: 30px 10px;
    color: #667085;
}

#daftarJadwal {
    display: none;
}
</style>
</head>

<body>

<div class="kartu">

    <h1>🏫 RUANG UJIAN</h1>

    <div class="sub">
        Portal Ujian Sekolah
    </div>

    <div class="tanggal" id="tanggalHariIni">
        Memuat tanggal...
    </div>

    <h3>Pilih Kelas</h3>

    <div class="pilih-kelas">

        <button onclick="pilihKelas('X')" id="btnX">
            KELAS X
        </button>

        <button onclick="pilihKelas('XI')" id="btnXI">
            KELAS XI
        </button>

        <button onclick="pilihKelas('XII')" id="btnXII">
            KELAS XII
        </button>

    </div>

    <div id="daftarJadwal">

        <h3 id="judulKelas"></h3>

        <div id="isiJadwal"></div>

    </div>

    <div class="info">
        <b>Informasi:</b><br><br>

        🔒 Belum dimulai = ujian belum dapat dibuka.<br>
        🟢 Ujian aktif = soal dapat dibuka.<br>
        🔴 Selesai = waktu ujian sudah habis dan soal tidak dapat dibuka.
    </div>

</div>

<script>

/* ==================================================
   DATA JADWAL UJIAN
   NANTI BAGIAN INI YANG MUDAH KITA EDIT
================================================== */

const jadwalUjian = [

    /*
    SENIN
    */

    {
    tanggal: "2026-08-25",
    kelas: "X",
    mapel: "UJI COBA PORTAL",
    mulai: "16:05",
selesai: "16:15",
    link: "https://forms.gle/1GCPekfDyv4WtfbW6"
},

    {
        tanggal: "2026-08-31",
        kelas: "XI",
        mapel: "Bahasa Indonesia",
        mulai: "08:00",
        selesai: "09:00",
        link: "#"
    },

    {
        tanggal: "2026-08-31",
        kelas: "XII",
        mapel: "Bahasa Indonesia",
        mulai: "08:00",
        selesai: "09:00",
        link: "#"
    },

    {
        tanggal: "2026-08-31",
        kelas: "X",
        mapel: "Bahasa Inggris",
        mulai: "10:00",
        selesai: "11:00",
        link: "#"
    },

    {
        tanggal: "2026-08-31",
        kelas: "XI",
        mapel: "Matematika",
        mulai: "10:00",
        selesai: "11:00",
        link: "#"
    },


    /*
    SELASA
    */

    {
        tanggal: "2026-09-01",
        kelas: "X",
        mapel: "Sejarah",
        mulai: "08:00",
        selesai: "09:00",
        link: "#"
    },

    {
        tanggal: "2026-09-01",
        kelas: "XI",
        mapel: "Sejarah",
        mulai: "08:00",
        selesai: "09:00",
        link: "#"
    },

    {
        tanggal: "2026-09-01",
        kelas: "XII",
        mapel: "Matematika",
        mulai: "10:00",
        selesai: "11:30",
        link: "#"
    }

];


/* ==================================================
   VARIABEL
================================================== */

let kelasTerpilih = null;


/* ==================================================
   TANGGAL HARI INI
================================================== */

function tanggalHariIni() {

    const sekarang = new Date();

    const tahun =
        sekarang.getFullYear();

    const bulan =
        String(sekarang.getMonth() + 1)
        .padStart(2, "0");

    const tanggal =
        String(sekarang.getDate())
        .padStart(2, "0");

    return tahun + "-" + bulan + "-" + tanggal;
}


/* ==================================================
   FORMAT TANGGAL
================================================== */

function tampilkanTanggal() {

    const sekarang = new Date();

    const pilihan = {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    };

    document.getElementById(
        "tanggalHariIni"
    ).innerText =
        sekarang.toLocaleDateString(
            "id-ID",
            pilihan
        );
}


/* ==================================================
   PILIH KELAS
================================================== */

function pilihKelas(kelas) {

    kelasTerpilih = kelas;

    document.getElementById("btnX")
        .classList.remove("kelas-aktif");

    document.getElementById("btnXI")
        .classList.remove("kelas-aktif");

    document.getElementById("btnXII")
        .classList.remove("kelas-aktif");


    if (kelas === "X") {
        document.getElementById("btnX")
            .classList.add("kelas-aktif");
    }

    if (kelas === "XI") {
        document.getElementById("btnXI")
            .classList.add("kelas-aktif");
    }

    if (kelas === "XII") {
        document.getElementById("btnXII")
            .classList.add("kelas-aktif");
    }


    document.getElementById(
        "daftarJadwal"
    ).style.display = "block";

    document.getElementById(
        "judulKelas"
    ).innerText =
        "Jadwal Kelas " + kelas;

    tampilkanJadwal();
}


/* ==================================================
   TAMPILKAN JADWAL HARI INI
================================================== */

function tampilkanJadwal() {

    const hariIni =
        tanggalHariIni();

    const sekarang =
        new Date();


    const jadwalHariIni =
        jadwalUjian.filter(function(jadwal) {

            return (
                jadwal.tanggal === hariIni &&
                jadwal.kelas === kelasTerpilih
            );

        });


    const tempat =
        document.getElementById(
            "isiJadwal"
        );


    tempat.innerHTML = "";


    if (jadwalHariIni.length === 0) {

        tempat.innerHTML =
            `<div class="kosong">
                Tidak ada ujian untuk kelas ini hari ini.
            </div>`;

        return;
    }


    jadwalHariIni.forEach(function(jadwal) {

        const mulai =
            new Date(
                jadwal.tanggal +
                "T" +
                jadwal.mulai
            );

        const selesai =
            new Date(
                jadwal.tanggal +
                "T" +
                jadwal.selesai
            );


        let status;
        let kelasStatus;
        let tombol;


        if (sekarang < mulai) {

            status =
                "🔒 BELUM DIMULAI";

            kelasStatus =
                "belum";

            tombol =
                `<button disabled
                    style="background:#98a2b3;">
                    TERKUNCI
                </button>`;

        }

        else if (
            sekarang >= mulai &&
            sekarang < selesai
        ) {

            status =
                "🟢 UJIAN AKTIF";

            kelasStatus =
                "aktif";


            if (jadwal.link !== "#") {

                tombol =
                    `<button
                        onclick="bukaSoal('${jadwal.link}')">
                        🔗 BUKA SOAL
                    </button>`;

            } else {

                tombol =
                    `<button disabled
                        style="background:#98a2b3;">
                        LINK BELUM DIISI
                    </button>`;

            }

        }

        else {

            status =
                "🔴 UJIAN SELESAI";

            kelasStatus =
                "selesai";

            tombol =
                `<button disabled
                    style="background:#98a2b3;">
                    SUDAH DITUTUP
                </button>`;
        }


        tempat.innerHTML += `

            <div class="jadwal">

                <div class="mapel">
                    ${jadwal.mapel}
                </div>

                <div class="waktu">
                    ⏰ ${jadwal.mulai}
                    – ${jadwal.selesai}
                </div>

                <div class="status ${kelasStatus}">
                    ${status}
                </div>

                ${tombol}

            </div>

        `;

    });

}


/* ==================================================
   BUKA SOAL
================================================== */

function bukaSoal(link) {

    if (link === "#") {
        return;
    }

    window.open(link, "_blank");
}


/* ==================================================
   UPDATE OTOMATIS
================================================== */

setInterval(function() {

    if (kelasTerpilih) {
        tampilkanJadwal();
    }

}, 1000);


/* ==================================================
   MULAI
================================================== */

tampilkanTanggal();

</script>

</body>
</html>
